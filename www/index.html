<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Ink Blast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="menuBackground"></div>

  <div class="app">
    <!-- MENU SCREEN -->
    <div id="menuScreen" class="screen active">
      <div class="settings-buttons">
        <button id="soundBtn" class="setting-btn on">🔊</button>
        <button id="musicBtn" class="setting-btn on">🎵</button>
        <button id="vibrationBtn" class="setting-btn on">📳</button>
      </div>

      <div class="ad-blocker-wrap">
        <button id="adBlockerBtn">
           Bloquer pubs
        </button>
        <div id="adBlockerStatus" style="font-size: 11px; color: rgba(250,243,225,0.6); margin-top: 4px; text-align: center;">
          Publicités activées
        </div>
      </div>

      <h1 style="font-size: 48px; font-weight: 900; margin-bottom: 40px; letter-spacing: 2px; text-shadow: 0 4px 12px rgba(0,0,0,0.4);">
        INK BLAST
      </h1>

      <button id="startBtn" style="padding: 16px 48px; font-size: 20px; font-weight: 900; border: none; border-radius: 16px; background: linear-gradient(180deg, #66bb6a, #43a047); color: #fff; cursor: pointer; box-shadow: 0 8px 24px rgba(67,160,71,0.4); transition: all 150ms ease;">
        JOUER
      </button>

      <button id="settingsBtn" style="margin-top: 16px; padding: 12px 32px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; background: rgba(250,243,225,0.15); color: #faf3e1; cursor: pointer; transition: all 150ms ease;">
        PARAMÈTRES
      </button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen">
      <div class="score-wrap">
        <div id="currentScore" class="current-score">0</div>
        <div class="best-score">
          <span class="best-label">MEILLEUR</span>
          <span id="bestScoreValue" class="best-value">0</span>
        </div>
      </div>

      <div class="board-shell">
        <canvas id="gameCanvas"></canvas>
        <div id="comboBadge" class="combo-badge hidden"></div>
        <div id="praiseBadge" class="praise-badge hidden"></div>
      </div>

      <div class="available-wrap">
        <span class="available-label">BLOCS RESTANTS</span>
        <div id="availablePill" class="available-pill">
          <span id="availableCount" class="available-count">3</span>
        </div>
      </div>

      <!-- GAME OVER OVERLAY -->
      <div id="gameOverOverlay" class="hidden">
        <div class="gameover-panel">
          <div class="defeat-msg">PARTIE TERMINÉE</div>

          <div class="countdown-wrap">
            <svg class="countdown-ring" viewBox="0 0 100 100">
              <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
              <circle id="ringFg" class="ring-fg" cx="50" cy="50" r="45"></circle>
            </svg>
            <div id="countdownValue" class="countdown-value">10</div>
          </div>

          <div class="continue-msg">Une nouvelle partie commencera bientôt...</div>

          <div class="gameover-actions">
            <button id="restartBtn" class="restart-btn">
              <span>🔄</span>
              RESTART
            </button>
            <button id="adsBtn" class="ads-btn">
              <span>📺</span>
              CONTINUER AVEC PUB
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="settingsPanel" class="settings-panel">
      <div class="settings-title">PARAMÈTRES</div>

      <div class="setting-row">
        <span class="setting-label">Son</span>
        <div id="settingSoundToggle" class="setting-toggle on"></div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Musique</span>
        <div id="settingMusicToggle" class="setting-toggle on"></div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Vibrations</span>
        <div id="settingVibrationToggle" class="setting-toggle on"></div>
      </div>

      <button id="settingsCloseBtn" class="settings-close">FERMER</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
