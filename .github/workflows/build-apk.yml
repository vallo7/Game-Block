name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Generate crisp app icon
        run: |
          if [ -f icon.png ]; then
            # Supprime l'icône adaptative par défaut
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            # Recadre au centre en carré parfait
            convert icon.png -gravity center -crop "%[fx:min(w,h)]x%[fx:min(w,h)]+0+0" +repage /tmp/icon_square.png

            # Base haute résolution 1024x1024
            convert /tmp/icon_square.png -resize 1024x1024 /tmp/icon_1024.png

            # Génère toutes les densités Android
            for entry in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
              set -- $entry
              px="$1"
              name="$2"
              dir="android/app/src/main/res/mipmap-$name"

              mkdir -p "$dir"
              convert /tmp/icon_1024.png -resize ${px}x${px} "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            done

            echo "Custom icon generated."
          else
            echo "icon.png not found, keeping default icon."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ink-blast-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
